name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test tools
        run: python -m pip install cryptography ruff==0.16.8
      - name: Run standalone tests
        run: python -m unittest discover -s tests -v
      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .
